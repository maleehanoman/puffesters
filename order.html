<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><title>Order | Puffesters</title></head><body data-page="order">
<main>
<h1 class="title3d" style="font-size:3.5rem">Order here</h1>
<div class="toolbar">
  <input id="search" type="search" placeholder="🔍 Search matcha, cake, latte..." aria-label="Search menu">
  <select id="sort" aria-label="Sort"><option value="">Sort: default</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="menu"></div>
<p id="empty" class="hidden center">No treats found. Try another word! 🍃</p>
</main>
<script src="script.js"></script></body></html>
