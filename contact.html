<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><title>Contact | Puffesters</title></head><body data-page="contact">
<main>
<h1 class="title3d" style="font-size:3.5rem">Say hi</h1>
<section>
  <h2>Workshop application</h2>
  <form class="box" id="apply">
    <div class="two">
      <label>Your name<input name="name" required></label>
      <label>Phone or email<input name="contact" required></label>
    </div>
    <div class="two">
      <label>Workshop<select name="workshop" id="wsel" required></select></label>
      <label>Preferred date<input type="date" name="date" required></label>
    </div>
    <label>Number of seats<input type="number" name="seats" min="1" max="6" value="1" required></label>
    <label>Message (optional)<textarea name="msg" rows="3"></textarea></label>
    <button class="btn green" type="submit">Send application</button>
  </form>
  <div class="note hidden" id="thanks"></div>
</section>
<section>
  <h2>Find us</h2>
  <p>📍 Karachi &nbsp; 📞 +92 12345678 &nbsp; ✉️ hello@puffesters.com</p><br>
  <iframe title="Map" loading="lazy" src="https://www.google.com/maps?q=Karachi&output=embed"></iframe>
</section>
</main>
<script src="script.js"></script></body></html>
